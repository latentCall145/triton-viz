<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton Viz Shell</title>
    <link rel="stylesheet" href="/static/vendor/codemirror/codemirror.css">
    <link rel="stylesheet" href="/static/shell/layout.css">
</head>
<body>
    <div id="app" class="app">
        <header class="tab-bar" id="tab-bar"></header>
        <div class="split" id="split-root">
            <section class="pane left-pane" id="left-pane">
                <div class="editor-host" id="editor-host"></div>
            </section>
            <div class="gutter" id="gutter" aria-label="Resize panels"></div>
            <section class="pane right-pane" id="right-pane">
                <div class="pane-content" id="graph-pane"></div>
                <div class="pane-content" id="op-pane"></div>
            </section>
        </div>
    </div>
    <script type="module" src="/static/shell/main.js"></script>
</body>
</html>
